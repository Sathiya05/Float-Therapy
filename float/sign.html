<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Static Labs</title>
  <link rel="icon" href="images/logo.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#38BDF8',
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body class="bg-slate-50 dark:bg-[#0a0f1a] transition-colors duration-300 font-sans flex flex-col min-h-screen p-4">

  <div class="flex justify-end rtl:justify-start gap-3 mb-4">
    <button id="themeToggleBtn"
      class="w-10 h-10 rounded-full bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-brand dark:hover:text-brand transition">
      <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
    </button>
    <button id="rtlToggleBtn"
      class="w-10 h-10 rounded-full bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-brand dark:hover:text-brand transition">
      <i class="bi bi-arrow-left-right"></i>
    </button>
  </div>

  <div class="flex-1 flex items-center justify-center">
    <div
      class="w-full max-w-md bg-white dark:bg-[#111827] rounded-3xl shadow-lg border border-slate-200 dark:border-white/5 p-5 sm:p-8 relative overflow-hidden">

      <i
        class="bi bi-person-plus absolute -right-6 -bottom-6 text-9xl text-brand opacity-5 rtl:-left-6 rtl:right-auto pointer-events-none"></i>

      <div class="text-center mb-4 sm:mb-8 relative z-10">
        <h1 class="text-2xl text-slate-900  font-bold">
          <a href="index.html">
            STATIC <span class="text-[#38BDF8] font-bold">LABS</span>
          </a>
        </h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Create Your Account</p>
      </div>

      <form class="space-y-3 sm:space-y-4 relative z-10"
        onsubmit="event.preventDefault(); window.location.href='index.html';">

        <div class="space-y-1.5">
          <label for="name" class="block text-xs font-bold text-slate-700 dark:text-slate-300 px-1">Full Name</label>
          <div class="relative flex items-center">
            <i class="bi bi-person absolute left-4 rtl:right-4 rtl:left-auto text-slate-400"></i>
            <input type="text" id="name" placeholder="John Doe"
              class="w-full pl-11 pr-4 rtl:pr-11 rtl:pl-4 py-2 sm:py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition"
              required>
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-bold text-slate-700 dark:text-slate-300 px-1">Email
            Address</label>
          <div class="relative flex items-center">
            <i class="bi bi-envelope absolute left-4 rtl:right-4 rtl:left-auto text-slate-400"></i>
            <input type="email" id="email" placeholder="name@example.com"
              class="w-full pl-11 pr-4 rtl:pr-11 rtl:pl-4 py-2 sm:py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition"
              required>
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-bold text-slate-700 dark:text-slate-300 px-1">Password</label>
          <div class="relative flex items-center">
            <i class="bi bi-lock absolute left-4 rtl:right-4 rtl:left-auto text-slate-400"></i>
            <input type="password" id="password" placeholder="Create a strong password"
              class="w-full pl-11 pr-11 rtl:pr-11 rtl:pl-11 py-2 sm:py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition"
              required>
            <button type="button" onclick="togglePassword('password', 'eye1')"
              class="absolute right-4 rtl:left-4 rtl:right-auto text-slate-400 hover:text-brand transition">
              <i id="eye1" class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="space-y-1.5">
          <label for="confirm-password" class="block text-xs font-bold text-slate-700 dark:text-slate-300 px-1">Confirm
            Password</label>
          <div class="relative flex items-center">
            <i class="bi bi-lock absolute left-4 rtl:right-4 rtl:left-auto text-slate-400"></i>
            <input type="password" id="confirm-password" placeholder="Repeat your password"
              class="w-full pl-11 pr-11 rtl:pr-11 rtl:pl-11 py-2 sm:py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-800 dark:text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition"
              required>
            <button type="button" onclick="togglePassword('confirm-password', 'eye2')"
              class="absolute right-4 rtl:left-4 rtl:right-auto text-slate-400 hover:text-brand transition">
              <i id="eye2" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-start pt-2 gap-3">
          <label class="flex items-center cursor-pointer mt-0.5">
            <input type="checkbox" class="accent-brand w-4 h-4 rounded border-slate-300 cursor-pointer" required>
          </label>
          <span class="text-xs font-medium text-slate-600 dark:text-slate-400 leading-relaxed">
            I agree to the <a href="#" class="font-bold text-brand hover:text-sky-500 transition">Terms of Service</a>
            and <a href="#" class="font-bold text-brand hover:text-sky-500 transition">Privacy Policy</a>.
          </span>
        </div>

        <div class="pt-2 sm:pt-4">
          <button type="submit"
            class="w-full py-3 bg-brand text-white rounded-xl font-bold text-sm shadow-md hover:bg-sky-500 hover:shadow-lg hover:-translate-y-0.5 transition duration-200 flex items-center justify-center gap-2">
            Sign Up <i class="bi bi-arrow-right rtl:rotate-180"></i>
          </button>
        </div>

      </form>

      <!-- Social Login -->
      <div class="relative my-5 sm:my-6 flex items-center gap-3 relative z-10">
        <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest whitespace-nowrap">Or continue
          with</span>
        <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
      </div>

      <div class="grid grid-cols-3 gap-3 relative z-10">
        <!-- Google -->
        <button id="googleLoginBtn"
          class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md hover:-translate-y-0.5 transition duration-200">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Google
        </button>

        <!-- Facebook -->
        <button id="facebookLoginBtn"
          class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md hover:-translate-y-0.5 transition duration-200">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
          Facebook
        </button>

        <!-- Apple -->
        <button id="appleLoginBtn"
          class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 hover:shadow-md hover:-translate-y-0.5 transition duration-200">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.4.07 2.38.74 3.2.8 1.22-.24 2.38-.93 3.67-.84 1.55.12 2.72.72 3.47 1.84-3.19 1.88-2.44 5.98.48 7.13-.57 1.39-1.32 2.76-2.82 3.95zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
          </svg>
          Apple
        </button>
      </div>

      <div class="mt-4 sm:mt-8 text-center relative z-10 border-t border-slate-100 dark:border-slate-800 pt-4 sm:pt-6">
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
          Already have an account?
          <a href="login.html"
            class="font-bold text-slate-800 dark:text-white hover:text-brand dark:hover:text-brand transition ml-1 rtl:mr-1 rtl:ml-0">Login</a>
        </p>
      </div>

    </div>
  </div>

  <script>
    // Theme Toggle Logic
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIcon = document.getElementById("themeIcon");

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains("dark");
      themeIcon.className = isDark ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
    }

    // Set initial icon
    updateThemeIcon();

    themeToggleBtn.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    });

    // RTL Toggle Logic
    const rtlToggleBtn = document.getElementById("rtlToggleBtn");

    rtlToggleBtn.addEventListener("click", () => {
      const isRtl = document.documentElement.dir === "rtl";
      document.documentElement.dir = isRtl ? "ltr" : "rtl";
    });
    // Password visibility toggle
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    }
  </script>
</body>

</html>
